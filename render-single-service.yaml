# Simplified Single-Service Render Configuration
# This deploys both backend and frontend as one service
# Use this instead of render.yaml for easier deployment

services:
  - type: web
    name: agribridge
    env: python
    plan: starter  # Required for sufficient RAM (free tier may run out of memory)
    buildCommand: |
      echo "Installing backend dependencies..."
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
      cd ..
      echo "Building frontend..."
      cd frontend
      npm ci --production=false
      npm run build
      cd ..
      echo "Build complete!"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false  # ⚠️ MUST add manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        generateValue: true

# Instructions:
# 1. Rename this file to render.yaml (replace the existing one)
# 2. Commit and push to GitHub
# 3. In Render Dashboard:
#    - Create new Web Service
#    - Connect to your GitHub repo
#    - Render will auto-detect render.yaml
# 4. Add environment variable in Render:
#    - GEMINI_API_KEY = your_actual_api_key
# 5. Deploy!
# 
# The backend will serve both:
# - API endpoints at /api/v1/*
# - Frontend static files at /*
# 
# Single URL, no CORS issues!
