services:
  # Backend API Service
  - type: web
    name: agribridge-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false  # ⚠️ MUST add this manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

  # Frontend Static Site
  - type: static
    name: agribridge-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: "https://agribridge-backend.onrender.com"  # ⚠️ MUST match your actual backend URL
