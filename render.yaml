services:
  # Backend API Service
  - type: web
    name: agribridge-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # Add this manually in the Render dashboard

  # Frontend Static Site
  - type: web
    name: agribridge-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agribridge-backend
          envVarKey: RENDER_EXTERNAL_URL
